[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "target6qui-vecdb_jd078"
version = "0.1.0"
description = "通过字符级与结构级特征识别向量数据库内核工程师·敏感信息的脱敏与回填的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "target6qui" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://target6qui.github.io"
Repository = "https://github.com/target6qui/vecdb_jd078"
Issues = "https://github.com/target6qui/vecdb_jd078/issues"

[project.scripts]
vecdb_jd078 = "vecdb_jd078:main"

[tool.setuptools]
py-modules = ["vecdb_jd078"]
